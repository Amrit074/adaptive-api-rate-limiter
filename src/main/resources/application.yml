server:
  port: ${PORT:${SERVER_PORT:8080}}

spring:
  application:
    name: smart-rate-limiter

  # MySQL Configuration
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/rate_limiter_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
    show-sql: ${SPRING_JPA_SHOW_SQL:false}
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

  # Redis Configuration
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      username: ${SPRING_DATA_REDIS_USERNAME:}
      password: ${SPRING_DATA_REDIS_PASSWORD:}
      timeout: ${SPRING_DATA_REDIS_TIMEOUT:2000ms}
      ssl:
        enabled: ${SPRING_DATA_REDIS_SSL_ENABLED:false}

# Rate Limiter Configuration
rate-limiter:
  # Max requests per window per IP
  max-requests: ${RATE_LIMITER_MAX_REQUESTS:100}
  # Window size in seconds
  window-seconds: ${RATE_LIMITER_WINDOW_SECONDS:60}
  # Blocklist TTL in seconds (how long an anomalous IP stays blocked)
  block-ttl-seconds: ${RATE_LIMITER_BLOCK_TTL_SECONDS:300}

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: ${MANAGEMENT_ENDPOINT_HEALTH_SHOW_DETAILS:when_authorized}

# Swagger UI
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
